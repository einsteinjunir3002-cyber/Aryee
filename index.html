<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Josephine!</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@400;600&display=swap');

        /* Custom Sleek Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff477e;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ff2a6d;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            overflow: hidden;
            position: relative;
        }

        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.9);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
            border: 4px solid #fff;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff477e;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #ffd166;
        }

        p {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 2.2rem; }
            .container {
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        .card {
            background: #fff;
            border-radius: 15px;
            padding: 30px 20px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(255, 71, 126, 0.3);
            border-color: #ff477e;
        }

        .card.game-card:hover {
            box-shadow: 0 15px 25px rgba(74, 144, 226, 0.3);
            border-color: #4a90e2;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        
        .card.game-card .card-title {
            color: #4a90e2;
        }

        .card.wish-card .card-title {
            color: #ff477e;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #777;
        }


    </style>
</head>
<body>

    <div class="bubbles" id="bubbles"></div>

    <div class="container">
        <h1>Happy Birthday Josephine! 🎉</h1>
        <p>I have prepared two special surprises for you today. Which one would you like to open first?</p>
        
        <div class="options-grid">
            <a href="BESTIE/index.html" class="card game-card">
                <div class="card-icon">🎮</div>
                <div class="card-title">The Adventure</div>
                <div class="card-desc">Help the avatar collect cupcakes and find hidden gifts in a retro platformer!</div>
            </a>
            
            <a href="wish.html" class="card wish-card">
                <div class="card-icon">💌</div>
                <div class="card-title">The Birthday Wish</div>
                <div class="card-desc">Read the special birthday message and view memories.</div>
            </a>
        </div>
    </div>

    <script>
        // Generate floating bubbles
        const bubblesContainer = document.getElementById('bubbles');
        for (let i = 0; i < 20; i++) {
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const size = Math.random() * 60 + 20;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 100}%`;
            bubble.style.animationDuration = `${Math.random() * 10 + 5}s`;
            bubble.style.animationDelay = `${Math.random() * 5}s`;
            bubblesContainer.appendChild(bubble);
        }
    </script>
    <script src="scroll.js"></script>
</body>
</html>
